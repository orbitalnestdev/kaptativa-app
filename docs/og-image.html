<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#0F0F12 radial-gradient(ellipse 620px 520px at 1000px 190px, rgba(124,92,255,.32), rgba(124,92,255,.08) 55%, transparent 75%);font-family:Lexend,sans-serif;color:#fff;position:relative}
  .logo{position:absolute;left:86px;top:78px}
  h1{position:absolute;left:90px;top:214px;margin:0;font-weight:600;font-size:59px;line-height:1.18;letter-spacing:-.5px}
  h1 span{color:#A08CFF}
  p{position:absolute;left:90px;top:372px;margin:0;font-size:23px;line-height:1.5;color:#B9B7C4}
  .url{position:absolute;left:90px;top:552px;font-size:21px;color:#B9B7C4}
  .iso{position:absolute;left:968px;top:150px;filter:drop-shadow(0 22px 34px rgba(124,92,255,.45))}
</style></head><body>
<svg class="logo" height="78" viewBox="3 8 166 44"><g transform="translate(-1 7.6) scale(0.69)" stroke="#7C5CFF" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M 26 47 C 17 41 11 36 11 30 C 11 24 19 20 26 13"/><path d="M 13.5 13 L 26 13 L 26 25.5"/></g><text x="26" y="39" font-family="Lexend" font-size="27" font-weight="600" fill="#fff" letter-spacing="0.3">kaptativa<tspan fill="#7C5CFF">.</tspan></text></svg>
<h1>Sitio web y sistema de<br>gestión para <span>tu negocio.</span></h1>
<p>Tienda online, pedidos, facturación y asistente con IA<br>en una plataforma que administrás vos.</p>
<div class="url">kaptativa.com</div>
<div class="iso">  <svg viewBox="0 0 160 160" width="150" height="150">
    <defs>
      <linearGradient id="isoTile" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#A08CFF" />
        <stop offset="0.55" stop-color="#7C5CFF" />
        <stop offset="1" stop-color="#5B3FE0" />
      </linearGradient>
      <linearGradient id="isoSide" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4A32B8" />
        <stop offset="1" stop-color="#2E1F7A" />
      </linearGradient>
      <linearGradient id="isoGloss" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42" />
        <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
      </linearGradient>
      <filter id="isoShadow" x="-30%" y="-30%" width="160%" height="170%">
        <feGaussianBlur stdDeviation="9" />
      </filter>
    </defs>
    <!-- sombra en el piso -->
    <ellipse cx="82" cy="146" rx="46" ry="9" fill="#2E1F7A" opacity="0.55" filter="url(#isoShadow)" />
    <g transform="rotate(-8 80 80)">
      <!-- extrusión de la pastilla -->
      <rect x="28" y="40" width="104" height="104" rx="30" fill="url(#isoSide)" />
      <!-- cara de la pastilla -->
      <rect x="28" y="26" width="104" height="104" rx="30" fill="url(#isoTile)" />
      <!-- brillo superior -->
      <path d="M58 26h44a30 30 0 0 1 30 30v12c-24-6-50-8-104 0V56a30 30 0 0 1 30-30z" fill="url(#isoGloss)" />
      <!-- K de la marca: extrusión y cara -->
      <g transform="translate(47.625 25.5) scale(1.75)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
        <g stroke="#3B2A8F" transform="translate(0 3.2)">
          <path d="M 26 47 C 17 41 11 36 11 30 C 11 24 19 20 26 13" />
          <path d="M 13.5 13 L 26 13 L 26 25.5" />
        </g>
        <g stroke="#FFFFFF">
          <path d="M 26 47 C 17 41 11 36 11 30 C 11 24 19 20 26 13" />
          <path d="M 13.5 13 L 26 13 L 26 25.5" />
        </g>
      </g>
    </g>
  </svg></div>
</body></html>
