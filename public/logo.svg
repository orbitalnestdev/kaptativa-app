<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 215 44" width="100%" height="100%" aria-label="Kaptativa Logo">
  <defs>
    <!-- Pink-Red to Violet Gradient -->
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA384D" />
      <stop offset="100%" stop-color="#8A35E5" />
    </linearGradient>
  </defs>
  
  <!-- Smooth Organic K-Arrow Isotype (Shifted left for compact bounding box) -->
  <g>
    <!-- Vertical Stem -->
    <path d="M 6 13 L 6 47" stroke="url(#logo-gradient)" stroke-width="6.5" stroke-linecap="round" fill="none" />
    <!-- Smooth S-curve for diagonals -->
    <path d="M 28 47 C 18 41 11 36 11 30 C 11 24 18 19 26 13" stroke="url(#logo-gradient)" stroke-width="6.5" stroke-linecap="round" fill="none" />
    <!-- Arrowhead pointing up-right -->
    <path d="M 15 13 L 26 13 L 26 24" stroke="url(#logo-gradient)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  
  <!-- Text Part ("kaptativa.") - White text for dark backgrounds -->
  <text x="44" y="39" font-family="'Inter', sans-serif" font-size="27" font-weight="600" fill="#ffffff" letter-spacing="0.3">
    kaptativa<tspan fill="#EA384D">.</tspan>
  </text>
</svg>
